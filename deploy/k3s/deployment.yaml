apiVersion: apps/v1
kind: Deployment
metadata:
  name: note-keeper
  namespace: note-keeper
  labels:
    app: note-keeper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: note-keeper
  template:
    metadata:
      labels:
        app: note-keeper
    spec:
      initContainers:
        - name: init-dirs
          image: docker.io/library/note-keeper:latest
          imagePullPolicy: Never
          command:
            - sh
            - -c
            - mkdir -p /app/var/data /app/var/attachments /app/var/backups
          volumeMounts:
            - name: data
              mountPath: /app/var
      containers:
        - name: note-keeper
          image: docker.io/library/note-keeper:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: note-keeper-secrets
                  key: APP_ENCRYPTION_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: note-keeper-secrets
                  key: JWT_SECRET
            - name: JWT_EXPIRY_MS
              value: "86400000"
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: note-keeper-secrets
                  key: GOOGLE_CLIENT_ID
                  optional: true
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: note-keeper-secrets
                  key: GOOGLE_CLIENT_SECRET
                  optional: true
            - name: TELEGRAM_WEBHOOK_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: note-keeper-secrets
                  key: TELEGRAM_WEBHOOK_BASE_URL
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true
            - name: data
              mountPath: /app/var
          readinessProbe:
            httpGet:
              path: /api/v1/config
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/config
              port: http
            initialDelaySeconds: 40
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: config
          configMap:
            name: note-keeper-config
        - name: data
          persistentVolumeClaim:
            claimName: note-keeper-data
