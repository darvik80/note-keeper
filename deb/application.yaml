# Template only. The .deb installer writes /opt/note-keeper/etc/application.yaml
# with concrete values from debconf (dpkg-reconfigure note-keeper).
server:
  port: 8080
  forward-headers-strategy: native

spring:
  profiles:
    active: sqlite

app:
  storage:
    base-dir: /opt/note-keeper/var
  encryption:
    key: ""
  public-base-url: ""
  telegram:
    webhook-base-url: ""

jwt:
  secret: ""
  expiration: 86400000
