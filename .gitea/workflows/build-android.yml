name: Build & Publish Android APK

# Release APK from android/. Published to cogitor-products like the .deb.
# Optional signing secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them CI signs with debug keystore.
#
# Re-run from the Gitea Actions UI.

on:
  push:
    branches: ["master"]
    tags: ["v*"]
    paths:
      - "android/**"
      - "version.txt"
      - ".gitea/workflows/build-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Build release APK
    outputs:
      version: ${{ steps.version.outputs.version }}
      apk: ${{ steps.version.outputs.apk }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < version.txt)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "apk=note-keeper-android_${VERSION}.apk" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: gradle
          cache-dependency-path: android/**/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 — assembleRelease uses debug signing"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/notekeeper-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/notekeeper-release.jks" >> "$GITHUB_ENV"

      - name: Sync versionName from version.txt
        working-directory: android
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i -E "s/versionName = \"[^\"]+\"/versionName = \"${VERSION}\"/" app/build.gradle.kts

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease

      - name: Stage APK
        run: |
          SRC="$(ls android/app/build/outputs/apk/release/*.apk | head -n1)"
          test -n "$SRC"
          mkdir -p dist
          cp "$SRC" "dist/${{ steps.version.outputs.apk }}"
          ls -lh "dist/${{ steps.version.outputs.apk }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ steps.version.outputs.apk }}
          path: dist/${{ steps.version.outputs.apk }}
          retention-days: 30

  publish:
    runs-on: ubuntu-latest
    name: Publish to cogitor-products
    needs: build
    steps:
      - name: Download APK
        uses: actions/download-artifact@v3
        with:
          name: ${{ needs.build.outputs.apk }}

      - name: Upload to cogitor-products
        env:
          GITEA_TOKEN: ${{ secrets.DEB_GITEA_TOKEN }}
          APK: ${{ needs.build.outputs.apk }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test -n "$GITEA_TOKEN" || { echo "missing secret DEB_GITEA_TOKEN"; exit 1; }
          BASE="https://gitea.darvik.synology.me:8443/api/packages/Cogitor/generic/cogitor-products"
          AUTH="Authorization: token ${GITEA_TOKEN}"

          curl -k -sSf -X DELETE -H "$AUTH" "${BASE}/latest/$(basename "$APK")" || true
          curl -k -sSf -H "$AUTH" --upload-file "$APK" "${BASE}/latest/$(basename "$APK")"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            curl -k -sSf -H "$AUTH" --upload-file "$APK" "${BASE}/${VERSION}/$(basename "$APK")"
            echo "published ${VERSION} + latest to cogitor-products"
          else
            echo "published latest to cogitor-products"
          fi

  release:
    runs-on: ubuntu-latest
    name: Attach APK to Gitea Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download APK
        uses: actions/download-artifact@v3
        with:
          name: ${{ needs.build.outputs.apk }}

      - name: Create / update Release
        uses: https://gitea.com/actions/release-action@main
        with:
          files: ${{ needs.build.outputs.apk }}
          tag: ${{ github.ref_name }}
          title: "v${{ needs.build.outputs.version }}"
          body: |
            NoteKeeper Android v${{ needs.build.outputs.version }}

            Install the APK, then point the client at your server or https://note.cogitor.dev.
          api_key: ${{ secrets.GITEA_TOKEN }}
