name: k3s

on:
  push:
    branches: [ "master" ]

env:
  IMAGE_NAME: note-keeper
  IMAGE_REF: docker.io/library/note-keeper:latest
  K3S_HOST: 192.168.1.103
  K3S_USER: darvik

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        run: |
          export DOCKER_API_VERSION=1.43
          docker build -t "$IMAGE_NAME:latest" -t "$IMAGE_REF" .

      - name: Configure SSH
        env:
          K3S_SSH_KEY: ${{ secrets.K3S_SSH_KEY }}
        run: |
          test -n "$K3S_SSH_KEY" || { echo "Missing secret K3S_SSH_KEY"; exit 1; }
          mkdir -p ~/.ssh
          printf '%s\n' "$K3S_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$K3S_HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host k3s
            HostName ${K3S_HOST}
            User ${K3S_USER}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking accept-new
          EOF

      - name: Import image into k3s
        run: |
          export DOCKER_API_VERSION=1.43
          docker save "$IMAGE_REF" | gzip | ssh k3s 'gunzip | sudo k3s ctr images import -'

      - name: Apply manifests and rollout
        env:
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          TELEGRAM_WEBHOOK_BASE_URL: ${{ secrets.TELEGRAM_WEBHOOK_BASE_URL }}
        run: |
          set -euo pipefail
          test -n "${APP_ENCRYPTION_KEY:-}" || { echo "Missing secret APP_ENCRYPTION_KEY"; exit 1; }
          test -n "${JWT_SECRET:-}" || { echo "Missing secret JWT_SECRET"; exit 1; }

          b64() { printf '%s' "$1" | base64 -w0 2>/dev/null || printf '%s' "$1" | base64; }

          ssh k3s 'sudo k3s kubectl apply -f -' < deploy/k3s/namespace.yaml

          cat <<EOF | ssh k3s 'sudo k3s kubectl apply -f -'
          apiVersion: v1
          kind: Secret
          metadata:
            name: note-keeper-secrets
            namespace: note-keeper
          type: Opaque
          data:
            APP_ENCRYPTION_KEY: $(b64 "$APP_ENCRYPTION_KEY")
            JWT_SECRET: $(b64 "$JWT_SECRET")
            GOOGLE_CLIENT_ID: $(b64 "${GOOGLE_CLIENT_ID:-}")
            GOOGLE_CLIENT_SECRET: $(b64 "${GOOGLE_CLIENT_SECRET:-}")
            TELEGRAM_WEBHOOK_BASE_URL: $(b64 "${TELEGRAM_WEBHOOK_BASE_URL:-}")
          EOF

          ssh k3s 'sudo k3s kubectl apply -f -' < deploy/k3s/configmap.yaml
          ssh k3s 'sudo k3s kubectl apply -f -' < deploy/k3s/pvc.yaml
          ssh k3s 'sudo k3s kubectl apply -f -' < deploy/k3s/deployment.yaml
          ssh k3s 'sudo k3s kubectl apply -f -' < deploy/k3s/service.yaml

          ssh k3s 'sudo k3s kubectl -n note-keeper rollout restart deployment/note-keeper'
          ssh k3s 'sudo k3s kubectl -n note-keeper rollout status deployment/note-keeper --timeout=180s'
          ssh k3s 'sudo k3s kubectl -n note-keeper get pods,svc'
