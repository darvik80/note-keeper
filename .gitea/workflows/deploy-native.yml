name: Deploy native on NAS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: deploy-only pushes image already on minipc (no Graal rebuild)
        type: choice
        default: deploy-only
        options:
          - deploy-only
          - build-and-deploy
      spring_profile:
        description: Spring profile
        required: true
        default: sqlite
        type: choice
        options:
          - sqlite
          - postgresql
  push:
    branches: [ "native" ]

env:
  TARGET_PORT: 9084
  CONTAINER_NAME: note-keeper-native
  REGISTRY: 192.168.1.103:5000
  IMAGE_NAME: note-keeper-native

jobs:
  build:
    runs-on: darvik-minipc
    timeout-minutes: 120
    steps:
      - name: Checkout
        if: github.event_name == 'push' || github.event.inputs.mode == 'build-and-deploy'
        uses: actions/checkout@v4

      - name: Login to registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          test -n "${REGISTRY_USER:-}" || { echo "Missing secret REGISTRY_USER"; exit 1; }
          test -n "${REGISTRY_PASSWORD:-}" || { echo "Missing secret REGISTRY_PASSWORD"; exit 1; }
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build native image
        if: github.event_name == 'push' || github.event.inputs.mode == 'build-and-deploy'
        run: |
          docker build -f Dockerfile.native \
            -t "$REGISTRY/$IMAGE_NAME:latest" \
            -t "$REGISTRY/$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" \
            .

      - name: Tag existing minipc image
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'deploy-only'
        run: |
          SRC=""
          if docker image inspect "$IMAGE_NAME:latest" >/dev/null 2>&1; then
            SRC="$IMAGE_NAME:latest"
          elif docker image inspect "$REGISTRY/$IMAGE_NAME:latest" >/dev/null 2>&1; then
            SRC="$REGISTRY/$IMAGE_NAME:latest"
          else
            echo "No $IMAGE_NAME on darvik-minipc. Run with mode=build-and-deploy."
            exit 1
          fi
          docker tag "$SRC" "$REGISTRY/$IMAGE_NAME:latest"
          docker tag "$SRC" "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"

      - name: Push
        run: |
          docker push "$REGISTRY/$IMAGE_NAME:latest"
          docker push "$REGISTRY/$IMAGE_NAME:${{ github.sha }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Login to registry
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          export DOCKER_API_VERSION=1.43
          test -n "${REGISTRY_USER:-}" || { echo "Missing secret REGISTRY_USER"; exit 1; }
          test -n "${REGISTRY_PASSWORD:-}" || { echo "Missing secret REGISTRY_PASSWORD"; exit 1; }
          echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Pull and run
        env:
          SPRING_PROFILE: ${{ github.event.inputs.spring_profile || 'sqlite' }}
        run: |
          set -euo pipefail
          export DOCKER_API_VERSION=1.43
          IMAGE="$REGISTRY/$IMAGE_NAME:${{ github.sha }}"
          docker pull "$IMAGE"
          mkdir -p "/volume1/docker/$CONTAINER_NAME/var"
          docker rm -f "$CONTAINER_NAME" || true
          docker run \
            -d -p "$TARGET_PORT:8080" \
            -e SPRING_PROFILES_ACTIVE="$SPRING_PROFILE" \
            --volume /volume1/docker/note-keeper/etc:/app/etc:ro \
            --volume "/volume1/docker/$CONTAINER_NAME/var:/app/var:rw" \
            --name "$CONTAINER_NAME" \
            "$IMAGE"
          docker ps --filter "name=$CONTAINER_NAME"
